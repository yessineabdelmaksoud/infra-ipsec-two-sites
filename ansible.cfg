[defaults]
roles_path = ./roles
filter_plugins = ./filter_plugins
remote_user = infra
private_key_file = ./.secrets/infra_ed25519
interpreter_python = auto_silent
stdout_callback = default
result_format = yaml
callbacks_enabled = ansible.posix.profile_tasks
forks = 10
timeout = 20

[ssh_connection]
# Lab VMs are rebuilt often: their host keys are not pinned.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR
pipelining = True
