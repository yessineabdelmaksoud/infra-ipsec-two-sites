# Common to every Linux VM. Ubuntu's automatic updates start as soon as a VM
# has Internet (Phase 2) and hold the package lock for minutes; on lab VMs we
# install packages only through Ansible, so they are switched off.

- name: Stop the daily package update timers
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop: [apt-daily.timer, apt-daily-upgrade.timer]

- name: Wait for a running update to release the package lock, then remove unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: absent
    lock_timeout: 900
