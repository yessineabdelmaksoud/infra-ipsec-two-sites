# Managed by Ansible (roles/haproxy) — Site B, node b-haproxy2
global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin
    user haproxy
    group haproxy
    daemon
    ssl-default-bind-options ssl-min-ver TLSv1.2

defaults
    mode http
    log global
    option httplog
    option dontlognull
    # Tell the web server who the real client is (X-Forwarded-For).
    option forwardfor
    timeout connect 5s
    timeout client  30s
    timeout server  30s

# Public entry point: OPNsense forwards WAN TCP 80/443 to the VIP.
frontend fe_web
    bind 10.15.15.100:80
    bind 10.15.15.100:443 ssl crt /etc/haproxy/certs/site.pem
    # Lets the page (and the failover test) show which proxy node answered.
    http-request set-header X-Proxy-Node b-haproxy2
    http-response set-header X-Proxy-Node b-haproxy2
    default_backend be_web

backend be_web
    # Health check: GET /health every 2 s; 3 failures = down, 2 successes = up.
    option httpchk
    http-check send meth GET uri /health
    http-check expect status 200
    server b-web 10.15.15.7:80 check inter 2s fall 3 rise 2

# Statistics page, LAN only: http://10.15.15.11:8404/stats
listen stats
    bind 10.15.15.11:8404
    stats enable
    stats uri /stats
    stats refresh 5s
