# Managed by Ansible (roles/keepalived) — Site A, node a-haproxy2 (BACKUP)
global_defs {
    router_id a-haproxy2
    enable_script_security
    script_user root
}

# Health of the local HAProxy. If it stops, this node gives the VIP away.
vrrp_script chk_haproxy {
    script "/usr/bin/systemctl is-active --quiet haproxy"
    interval 2      # check every 2 s
    fall 2          # 2 failures  -> FAULT (VIP released)
    rise 2          # 2 successes -> healthy again
}

vrrp_instance VI_SITE_A {
    state BACKUP                 # starting role; priority decides
    interface lan0
    virtual_router_id 51  # unique per site (A=51, B=52)
    priority 100  # MASTER 150 > BACKUP 100
    advert_int 1                    # "I am alive" every second
    # Unicast: the two nodes talk directly instead of using multicast.
    unicast_src_ip 10.0.2.6
    unicast_peer {
        10.0.2.5
    }
    authentication {
        auth_type PASS
        auth_pass REDACTED
    }
    virtual_ipaddress {
        10.0.2.100/24 dev lan0
    }
    track_script {
        chk_haproxy
    }
}
